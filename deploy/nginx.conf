# Konfigurasi Nginx reverse proxy untuk Madani Scholar.
# Ganti "domain-kamu.com" dengan domain asli, lalu:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/madani-scholar
#   sudo ln -s /etc/nginx/sites-available/madani-scholar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Setelah itu jalankan certbot untuk HTTPS (lihat DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name domain-kamu.com www.domain-kamu.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
